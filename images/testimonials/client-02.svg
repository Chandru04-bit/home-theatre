<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211D"/>
      <stop offset="100%" stop-color="#12100E"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECD5A6"/>
      <stop offset="50%" stop-color="#C6A15B"/>
      <stop offset="100%" stop-color="#A57F36"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#grad2)" stroke="url(#gold2)" stroke-width="3"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#gold2)" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  <!-- Silhouette / Portrait -->
  <g fill="url(#gold2)" filter="url(#shadow2)">
    <!-- Hair & Head -->
    <circle cx="60" cy="46" r="17"/>
    <!-- Elegant hair curve -->
    <path d="M42,46 C42,32 50,26 60,26 C70,26 78,32 78,46 C78,56 75,64 74,68 C68,66 64,65 60,65 C56,65 52,66 46,68 C45,64 42,56 42,46 Z" opacity="0.9"/>
    <!-- Shoulders / Torso -->
    <path d="M30,98 C30,80 44,72 60,72 C76,72 90,80 90,98 C80,106 70,110 60,110 C50,110 40,106 30,98 Z"/>
    <!-- Neckline -->
    <path d="M52,72 C52,78 68,78 68,72 Z" fill="#24211D" opacity="0.5"/>
  </g>
</svg>
